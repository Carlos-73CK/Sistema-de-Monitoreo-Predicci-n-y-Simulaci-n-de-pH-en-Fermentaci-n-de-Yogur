version: '3.8'

services:
  # Servicio de Base de Datos PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: prediyogur_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-prediyogur_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    networks:
      - prediyogur_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-prediyogur_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio Backend API en Node.js + Express
  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prediyogur_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-prediyogur_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-prediyogur_super_secret_key_2026}
      JWT_EXPIRES_IN: 7d
    ports:
      - "5000:5000"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - prediyogur_network

networks:
  prediyogur_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
